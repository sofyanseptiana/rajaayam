<!DOCTYPE html>
<html lang="id">

    <head>
        <meta charset="UTF-8">
        <title>Admin Raja Ayam</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 15px;
                font-size: 18px;
            }

            h1 {
                font-size: 36px;
                margin-bottom: 20px;
            }

            .order-card {
                border: 1px solid #ddd;
                border-radius: 10px;
                padding: 18px;
                margin-bottom: 15px;
                background: white;
            }

            .order-card h3 {
                font-size: 26px;
            }

            .order-card p {
                font-size: 20px;
            }

            button {
                min-height: 50px;
                min-width: 100px;
                font-size: 18px;
                border-radius: 8px;
            }
            .pending {
                background: #FFD54F;
                color: black;

                padding: 5px 10px;
                border-radius: 5px;

                display: inline-block;
                font-weight: bold;
            }
            .paid {
                background: #4CAF50;
                color: white;

                padding: 5px 10px;
                border-radius: 5px;

                display: inline-block;
                font-weight: bold;
            }

            .order-card {
                display: flex;
                justify-content: space-between;
                align-items: center;

                border: 1px solid #ccc;
                padding: 15px;
                margin-bottom: 10px;
            }

            .order-info h3 {
                font-size: 24px;
                margin-bottom: 12px;
            }
            .order-info p {
                font-size: 20px;
                margin: 8px 0;
            }

            .order-action {
                margin-top: 15px;
            }

            .order-action button {
                width: 100%;
                height: 55px;
                font-size: 20px;
                font-weight: bold;
            }


            .navbar-status {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }
            .navbar-status button {
                flex: 1;
                padding: 12px;
                border: none;
                border-radius: 8px;
                font-weight: bold;
            }
            /* Tab aktif */
            #btn-paid.active {
                background: #4CAF50;
                color: white;
                border-color: #4CAF50;
            }

            #btn-pending.active {
                background: #FFD54F;
                color: black;
                border-color: #FFD54F;
            }

            /* Tab tidak aktif */
            .navbar-status button {
                flex: 1;
                height: 50px;

                background: white;
                color: black;

                border: 3px solid black;
                border-radius: 8px;

                font-size: 18px;
                font-weight: bold;

                cursor: pointer;
            }
            .tab-btn {
                height: 55px;
                font-size: 20px;
                font-weight: bold;
            }
            #detail {
                font-size: 20px;
                line-height: 1.8;
                padding: 20px;
            }

            #btn-paid,
            #btn-pending {
                flex: 1;
                height: 50px;

                border: 3px solid black;
                background: white;

                font-size: 18px;
                font-weight: bold;
            }

            #btn-refresh {
                width: 120px;
                height: 50px;

                border: 3px solid black;
                background: #4CAF50;
                color: white;

                font-size: 18px;
                font-weight: bold;
            }
        </style>
    </head>

    <body>

        <h1>Admin Raja Ayam</h1>

        <div class="navbar-status">

            <button id="btn-paid"
                    onclick="loadPaid()">
                Paid
            </button>

            <button id="btn-pending"
                    onclick="loadPending()">
                Pending
            </button>

        </div>

        <div id="order-list">
            Memuat pesanan...

        </div>

        <h2>Detail Pesanan</h2>

        <div id="detail-order">
            Klik pesanan untuk melihat detail
        </div>

        <script>


            function lihatDetail(orderId, customerName) {

                fetch('/api/orders/' + orderId + '/items')
                        .then(response => response.json())
                        .then(data => {

                            let html = `
                    <h3>Order #${orderId}</h3>
                    <p>Nama: ${customerName}</p>
                    <hr>
                `;

                            data.forEach(item => {

                                html += `
                        <p>
                            ${item.nama} x${item.qty}
                        </p>
                    `;

                            });

                            document.getElementById(
                                    'detail-order'
                                    ).innerHTML = html;

                        });

            }

            function loadPending() {

                document.getElementById("btn-pending")
                        .classList.add("active");

                document.getElementById("btn-paid")
                        .classList.remove("active");

                fetch('/api/orders')
                        .then(response => response.json())
                        .then(data => {

                            let html = '';

                            data.forEach(order => {

                                if (order.status !== 'PENDING') {
                                    return;
                                }

                                html += buatCard(order);

                            });

                            document.getElementById(
                                    'order-list'
                                    ).innerHTML = html;

                        });

            }


            function loadPaid() {
                document.getElementById("btn-paid")
                        .classList.add("active");

                document.getElementById("btn-pending")
                        .classList.remove("active");

                fetch('/api/orders')
                        .then(response => response.json())
                        .then(data => {

                            let html = '';

                            data.forEach(order => {

                                if (order.status !== 'PAID') {
                                    return;
                                }

                                html += buatCard(order);

                            });

                            document.getElementById(
                                    'order-list'
                                    ).innerHTML = html;

                        });

            }

            function buatCard(order) {

                let tombol = '';

                if (order.status === 'PENDING') {
                    tombol = `
            <button
                onclick="event.stopPropagation();
                         bayar(${order.id})">
                Bayar
            </button>
        `;
                }

                if (order.status === 'PAID') {
                    tombol = `
            <button
                onclick="event.stopPropagation();
                         selesai(${order.id})">
                Selesai
            </button>
        `;
                }

                return `
        <div class="order-card">

            <div class="order-info"
                 onclick="lihatDetail(
                     ${order.id},
                     '${order.customerName}'
                 )">

                <h3>#${order.id} - ${order.customerName}</h3>

                <p>Total: Rp ${order.total}</p>

                <p>${order.status}</p>

            </div>

            <div class="order-action">
                ${tombol}
            </div>

        </div>
    `;
            }
            function buatCard(order) {

                let tombol = '';

                if (order.status === 'PENDING') {
                    tombol = `
            <button
                onclick="event.stopPropagation();
                         bayar(${order.id})">
                Bayar
            </button>
        `;
                }

                if (order.status === 'PAID') {
                    tombol = `
            <button
                onclick="event.stopPropagation();
                         selesai(${order.id})">
                Selesai
            </button>
        `;
                }

                return `
        <div class="order-card">

            <div class="order-info"
                 onclick="lihatDetail(
                     ${order.id},
                     '${order.customerName}'
                 )">

                <h3>#${order.id} - ${order.customerName}</h3>

                <p>Total: Rp ${order.total}</p>

                <p>${order.status}</p>

            </div>

            <div class="order-action">
                ${tombol}
            </div>

        </div>
    `;
            }

            function bayar(orderId) {

                fetch('/api/orders/' + orderId + '/paid', {
                    method: 'PUT'
                })
                        .then(response => response.text())
                        .then(data => {

                            loadPending();

                        });

            }
            function selesai(orderId) {

                fetch(
                        '/api/orders/' + orderId + '/completed',
                        {
                            method: 'PUT'
                        }
                )
                        .then(response => response.text())
                        .then(data => {


                            loadPaid();

                        });

            }

            loadPaid();

        </script>


    </body>

</html>

<!DOCTYPE html>
<html lang="id">

    <head>
        <meta charset="UTF-8">
        <title>Admin Raja Ayam</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }

            .order-card {
                border: 1px solid #ccc;
                padding: 10px;
                margin-bottom: 10px;
            }

            .pending {
                color: red;
                font-weight: bold;
            }
        </style>
    </head>

    <body>

        <h1>Admin Raja Ayam</h1>

        <div id="order-list">
            Memuat pesanan...

        </div>

        <h2>Detail Pesanan</h2>

        <div id="detail-order">
            Klik pesanan untuk melihat detail
        </div>

        <script>

            function lihatDetail(orderId, customerName) {

                fetch('/api/orders/' + orderId + '/items')
                        .then(response => response.json())
                        .then(data => {

                            let html = `
                <h3>Order #${orderId}</h3>
                <p>Nama: ${customerName}</p>
                <hr>
            `;

                            data.forEach(item => {

                                html += `
                    <p>
                        ${item.nama} x${item.qty}
                    </p>
                `;

                            });

                            document.getElementById(
                                    'detail-order'
                                    ).innerHTML = html;

                        });

            }

            fetch('/api/orders')
                    .then(response => response.json())
                    .then(data => {

                        let html = '';

                        data.forEach(order => {

                            html += `
                <div class="order-card"
                     onclick="lihatDetail(${order.id}, '${order.customerName}')">

                    <h3>
                        #${order.id} - ${order.customerName}
                    </h3>

                    <p>
                        Total: Rp ${order.total}
                    </p>

                    <p class="pending">
                        ${order.status}
                    </p>

                </div>
            `;

                        });

                        document.getElementById(
                                'order-list'
                                ).innerHTML = html;

                    });

        </script>


    </body>

</html>

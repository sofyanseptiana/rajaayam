<!DOCTYPE html>
<html lang="id">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Raja Ayam</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }

            .menu-card {
                border: 1px solid #ccc;
                padding: 10px;
                margin-bottom: 10px;
            }

            button {
                padding: 5px 10px;
                cursor: pointer;
            }

            #keranjang {
                margin-top: 30px;
                border-top: 2px solid black;
                padding-top: 15px;
            }
        </style>
    </head>

    <body>

        <h1>Raja Ayam</h1>

        <h2>Menu</h2>

        <div id="menu-list">
            Memuat menu...
        </div>

        <div id="keranjang">

            <h2>Pesanan</h2>

            <div id="pesanan-list">
                Belum ada pesanan
            </div>

            <h3 id="total">
                Total: Rp 0
            </h3>

            <input type="text"
                   id="namaPembeli"
                   placeholder="Nama pembeli">

            <br><br>

            <button onclick="pesan()">
                Pesan
            </button>

        </div>

        <script>

            let keranjang = [];

            fetch('/api/menu')
                    .then(response => response.json())
                    .then(data => {

                        let html = '';

                        data.forEach(menu => {

                            html += `
                            <div class="menu-card">
                                <b>${menu.nama}</b><br>
                                Rp ${menu.harga}<br><br>

                                <button onclick="tambahPesanan(
                                    ${menu.id},
                                    '${menu.nama}',
                                    ${menu.harga}
                                )">
                                    +
                                </button>
                            </div>
                        `;

                        });

                        document.getElementById('menu-list').innerHTML = html;

                    });
                    
                    

            function tambahPesanan(id, nama, harga) {

                let item = keranjang.find(x => x.id === id);

                if (item) {
                    item.qty++;
                } else {
                    keranjang.push({
                        id: id,
                        nama: nama,
                        harga: harga,
                        qty: 1
                    });
                }

                renderKeranjang();
            }

            function renderKeranjang() {

                let html = '';
                let total = 0;

                keranjang.forEach(item => {

                    html += `
                        <div>
                            ${item.nama}
                            x ${item.qty}
                        </div>
                    `;

                    total += item.harga * item.qty;

                });

                if (keranjang.length === 0) {
                    html = 'Belum ada pesanan';
                }

                document.getElementById('pesanan-list').innerHTML = html;

                document.getElementById('total').innerText =
                        'Total: Rp ' + total;
            }

            function pesan() {

                let nama = document.getElementById('namaPembeli').value;

                fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customerName: nama,
                        items: keranjang
                    })
                })
                        .then(response => response.text())
                        .then(data => alert(data));
            }

        </script>

    </body>

</html>
